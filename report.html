<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{cursor:pointer;border:none;background:none;font-family:inherit}

:root{
  --g:#0E2C22;--g2:#0A211A;--gs:#E6EFE9;--gold:#C6A664;--gold2:#A9884E;
  --ink:#1A1917;--ink2:#6B6860;--ink3:#A8A49E;
  --surf:#FFFFFF;--bg:#F6F1E4;--line:#E8E5DF;--line2:#CCC9C1;
}

/* ── 상단 학원명 바 ── */
.topbar{background:var(--g);padding:16px 20px;text-align:center}
.topbar-logo{max-height:32px;max-width:70%;margin:0 auto 8px;display:block}
.topbar-name{color:#fff;font-family:'Playfair Display',serif;font-size:18px;letter-spacing:-.2px}
.topbar-sub{color:rgba(255,255,255,.55);font-size:11px;margin-top:2px}
.topbar-phones{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.topbar-phone{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.2);white-space:nowrap}

.wrap{max-width:520px;margin:0 auto;padding:18px 16px 110px}

/* ── 학생 헤더 ── */
.stu-hd{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.stu-avatar{width:50px;height:50px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.stu-name{font-size:18px;font-weight:800;letter-spacing:-.3px}
.stu-sub{font-size:12px;color:var(--ink2);margin-top:2px}

/* ── 지금 이 순간 상태 (실시간) ── */
.live-status{display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:13.5px;font-weight:700}
.live-status .live-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.live-status.studying{background:#E7F8EE;color:#1C9962}
.live-status.studying .live-dot{background:#22B573;animation:live-pulse 1.6s infinite}
.live-status.in_class{background:#EAF1FF;color:#2B5FD9}
.live-status.in_class .live-dot{background:#4C8DFF}
.live-status.away{background:#F3EEFF;color:#7C4DE0}
.live-status.away .live-dot{background:#A78BFA}
.live-status.out{background:var(--bg);color:var(--ink3)}
.live-status.out .live-dot{background:var(--ink3)}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(34,181,115,.45)}70%{box-shadow:0 0 0 7px rgba(34,181,115,0)}100%{box-shadow:0 0 0 0 rgba(34,181,115,0)}}

/* ── 탭 ── */
.tabs{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;gap:4px}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:700;color:var(--ink2);border-radius:9px;transition:all .12s}
.tab.on{background:var(--g);color:#fff}

/* ── 날짜 네비 ── */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.dn-btn{width:32px;height:32px;border-radius:50%;background:var(--surf);border:1px solid var(--line);font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.dn-btn:active{background:var(--gs)}
.dn-label{font-size:14px;font-weight:700;letter-spacing:-.2px}

/* ── 카드 ── */
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:6px}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-grid.c2{grid-template-columns:repeat(2,1fr)}
.stat-grid.c4{grid-template-columns:repeat(2,1fr)}
.stat-cell{background:var(--bg);border-radius:12px;padding:14px 10px;text-align:center}
.stat-num{font-size:19px;font-weight:800;color:var(--g);letter-spacing:-.3px;white-space:nowrap}
.stat-lbl{font-size:11px;color:var(--ink2);margin-top:4px}

/* 집중도 지난 기간 비교 배너 — 숫자 하나보다 "좋아졌다/비슷하다"는
   느낌을 한눈에 알 수 있게 문장으로 보여줍니다. */
.focus-compare{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;line-height:1.45;cursor:pointer}
.focus-compare .fc-arrow{font-size:16px}
.focus-compare .fc-now{font-weight:600;opacity:.75}
.focus-compare.up{background:var(--gs);color:var(--g)}
.focus-compare.down{background:#F3EADA;color:var(--gold2)}
.focus-compare.flat{background:var(--bg);color:var(--ink2)}
.focus-compare.none{background:var(--bg);color:var(--ink3);font-weight:600;font-size:12.5px}

/* progress */
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog-pct{font-size:20px;font-weight:800;color:var(--g)}
.prog-bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g),#2E9E5B);border-radius:5px;transition:width .4s}

/* timeline list */
.tl-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-time{font-size:11px;color:var(--ink3);width:80px;flex-shrink:0;font-variant-numeric:tabular-nums}
.tl-ttl{font-size:13px;font-weight:500;flex:1}
.tl-ttl.done{color:var(--ink3);text-decoration:line-through}
.tl-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;flex-shrink:0}

/* subject bars */
.subj-row{margin-bottom:10px}
.subj-row:last-child{margin-bottom:0}
.subj-hd{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.subj-name{font-weight:600}
.subj-min{color:var(--ink2)}
.subj-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.subj-fill{height:100%;border-radius:4px}

/* attendance session */
.att-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:none}
.att-time{font-size:13px;font-weight:600}
.att-dur{font-size:12px;color:var(--ink2);background:var(--gs);padding:3px 10px;border-radius:10px;font-weight:600}
.att-empty{text-align:center;padding:20px 0;color:var(--ink3);font-size:12px}
.att-sub-note{font-size:11.5px;color:var(--ink2);padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.flag-note{font-size:12px;color:#92400E;background:#FEF3C7;border-radius:9px;padding:9px 12px;margin-top:10px;line-height:1.5;word-break:keep-all}

/* ai comment */
.ai-card{background:linear-gradient(135deg,var(--g),#1B4A38);border-radius:16px;padding:20px;margin-bottom:14px;color:#fff}
.ai-ttl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ai-text{font-size:14px;line-height:1.7}
.ai-loading{color:rgba(255,255,255,.5);font-size:12px}

/* exam list */
.exam-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.exam-item:last-child{border-bottom:none}
.exam-badge{font-size:10px;font-weight:700;background:#FEF0F0;color:#B91C1C;padding:3px 8px;border-radius:8px;flex-shrink:0}
.exam-date{font-size:12px;color:var(--ink2);width:56px;flex-shrink:0}
.exam-name{font-size:13px;font-weight:500}

/* growth bars */
.growth{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.gr-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gr-bar{width:100%;border-radius:6px 6px 0 0;background:var(--g);min-height:3px;transition:height .4s}
.gr-lbl{font-size:10px;color:var(--ink3);margin-top:6px}
.gr-val{font-size:10px;color:var(--ink2);font-weight:700;margin-bottom:4px}

.empty-note{text-align:center;padding:24px 10px;color:var(--ink3);font-size:12px;line-height:1.7}

/* ── 공유 바 ── */
.sharebar{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:520px;margin:0 auto;z-index:50}
.share-btn{flex:1;padding:12px 4px;border-radius:11px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);background:var(--bg)}
.share-btn .ico{font-size:17px}
.share-btn.kakao{background:#FEE500;color:#3A1D1D}
.share-btn.sms{background:var(--gs);color:var(--g)}

.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(6px);background:#18170F;color:#fff;padding:10px 22px;border-radius:20px;font-size:12px;font-weight:500;opacity:0;transition:all .2s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px;z-index:200}

@media print{
  .tabs,.datenav,.sharebar,.toast{display:none !important}
  body{background:#fff}
  .card,.stu-hd{border:1px solid #ddd;box-shadow:none;break-inside:avoid}
  .wrap{padding-bottom:20px}
}
</style>
</head>
<body>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-name" id="tb-academy">학원</div>
    <div class="topbar-sub">학습 리포트</div>
    <div class="topbar-phones">
      <a class="topbar-phone" href="tel:0312741334">📞 중등관 031-274-1334</a>
      <a class="topbar-phone" href="tel:0312751435">📞 고등관 031-275-1435</a>
    </div>
  </div>

  <div class="wrap">
    <div class="stu-hd">
      <div class="stu-avatar" id="stu-avatar">-</div>
      <div>
        <div class="stu-name" id="stu-name">-</div>

</div>

<script>
const SB="https://zmtldohklivkzpfdyflc.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdGxkb2hrbGl2a3pwZmR5ZmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjgxMDQsImV4cCI6MjA4ODU0NDEwNH0.cv1WrvDzNedVZABWyRCS9ARRxf4Si9qgeUqEvhpHWlo";

async function sb(path,opts={}){
  try{
    const r=await fetch(SB+'/rest/v1/'+path,{
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
      ...opts
    });
    if(r.status===204)return [];
    return await r.json();
  }catch(e){console.error('SB err',e);return null;}
}

const CATS=[
  {k:'kor',l:'국어',c:'#5B8EF0'},{k:'math',l:'수학',c:'#F06B6B'},{k:'eng',l:'영어',c:'#52B788'},
  {k:'sci',l:'과학',c:'#A47CF3'},{k:'soc',l:'사회',c:'#F4A442'},{k:'hist',l:'역사',c:'#D4874E'},
  {k:'hw',l:'학원숙제',c:'#E879A0'},{k:'perf',l:'수행평가',c:'#C084FC'},{k:'read',l:'독서',c:'#34D399'},
  {k:'self',l:'자습',c:'#78C6D4'},{k:'prep',l:'시험준비',c:'#F87171'},{k:'club',l:'동아리',c:'#60A5FA'},
  {k:'rest',l:'쉬는시간',c:'#94A3B8'},{k:'ex',l:'운동',c:'#FB923C'},{k:'eat',l:'식사',c:'#FBBF24'},{k:'etc',l:'기타',c:'#A8A49E'},
];
const SUBJECT_KEYS=['kor','math','eng','sci','soc','hist','hw','perf','read','self','prep'];
const DOW=['일','월','화','수','목','금','토'];

function dk(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseDk(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));x.setHours(0,0,0,0);return x;}
function fmtMin(mins){mins=Math.max(0,Math.round(mins));const h=Math.floor(mins/60),m=mins%60;return h?`${h}시간 ${m}분`:`${m}분`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

/* ── 실제 순공시간 계산: attendance_status_log 로그 기반 ──
   status='studying' 구간만 합산. 로그가 없는(예전) 기록은 체크인~체크아웃
   전체를 공부시간으로 간주(기존 방식)해 하위호환을 유지합니다. */
/* rangeStart/rangeEnd가 주어지면 그 기간에 걸치는 부분만 집계합니다 —
   전날부터 이어진 세션(예: 퇴실을 안 누르고 자정을 넘긴 경우)이 있어도
   해당 기간(오늘/이번주/이번달)의 순공시간이 실제보다 부풀지 않도록 합니다. */
function computeAttSegments(att,logsForAtt,rangeStart,rangeEnd){
  const segs={studying:0,in_class:0,away:0};
  const sorted=(logsForAtt||[]).slice().sort((a,b)=>new Date(a.changed_at)-new Date(b.changed_at));
  const sessionEnd=att.checkout_at?new Date(att.checkout_at):new Date();
  const clipStart=rangeStart&&rangeStart>new Date(att.checkin_at)?rangeStart:new Date(att.checkin_at);
  const clipEnd=rangeEnd&&rangeEnd<sessionEnd?rangeEnd:sessionEnd;
  if(clipEnd<=clipStart)return segs;
  if(!sorted.length){
    segs.studying=Math.max(0,(clipEnd-clipStart)/60000);
    return segs;
  }
  let curStatus='studying',curTime=new Date(att.checkin_at);
  sorted.forEach(l=>{
    const t=new Date(l.changed_at);
    const segFrom=curTime<clipStart?clipStart:curTime;
    const segTo=t>clipEnd?clipEnd:t;
    if(segTo>segFrom&&segs[curStatus]!==undefined)segs[curStatus]+=(segTo-segFrom)/60000;
    curStatus=l.status;curTime=t;
  });
  const segFrom=curTime<clipStart?clipStart:curTime;
  if(clipEnd>segFrom&&segs[curStatus]!==undefined)segs[curStatus]+=(clipEnd-segFrom)/60000;
  return segs;
}
function groupLogsByAttendance(logs){
  const m={};
  (logs||[]).forEach(l=>{(m[l.attendance_id]=m[l.attendance_id]||[]).push(l);});
  return m;
}
async function fetchAttWithSegments(query,rangeStart,rangeEnd){
  const att=await sb(query)||[];
  const ids=att.map(a=>a.id);
  const logs=ids.length?(await sb(`attendance_status_log?attendance_id=in.(${ids.join(',')})&select=attendance_id,status,changed_at`)||[]):[];
  const logsByAtt=groupLogsByAttendance(logs);
  att.forEach(a=>{a._seg=computeAttSegments(a,logsByAtt[a.id],rangeStart,rangeEnd);});
  return att;
}
/* 외출 비중이 상대적으로 길 때 상담 참고용 안내 문구 (학원수업 시간은 제외) */
function awayFlagNote(seg){
  const total=seg.studying+seg.in_class+seg.away;
  if(total<30||seg.away<30)return null;
  const ratio=seg.away/total;
  if(ratio<0.2)return null;
  return `독서실 체류시간 중 외출 비중이 ${Math.round(ratio*100)}%(${fmtMin(seg.away)})로 상대적으로 길어요. 상담 시 참고해보세요.`;
}
function sumSeg(atts){
  const s={studying:0,in_class:0,away:0};
  atts.forEach(a=>{s.studying+=a._seg.studying;s.in_class+=a._seg.in_class;s.away+=a._seg.away;});
  return s;
}
/* 집중도 분석 기능을 켠 독서실에서만 focus_log가 쌓입니다 — 기록이
   하나도 없으면(기능 미사용) null을 반환해서 카드 자체를 숨깁니다.
   판정 사유(reason)까지 같이 집계해서 "왜 이 점수가 나왔는지" 설명할 때 씁니다.
   attendance_id로만 걸러내면, 자정을 넘겨 계속 이어지는(체크아웃 안 한)
   출석 하나가 어제·오늘 리포트 양쪽에 다 걸려서 그 세션 전체 샘플이
   두 날짜에 똑같이 중복으로 나오는 문제가 있었습니다. start/end를
   주면 그 기간에 실제로 찍힌(checked_at) 샘플만 정확히 걸러냅니다. */
async function fetchFocusRate(attIds,start,end){
  const ids=attIds.filter(Boolean);
  if(!ids.length)return null;
  let q=`focus_log?attendance_id=in.(${ids.join(',')})&select=focused,reason`;
  if(start)q+=`&checked_at=gte.${start}`;
  if(end)q+=`&checked_at=lt.${end}`;
  const rows=await sb(q);
  if(!Array.isArray(rows)||!rows.length)return null;
  const total=rows.length;
  const counts={focused:0,no_face:0,head_turned:0,eyes_closed:0,dozing:0,unknown:0};
  rows.forEach(r=>{
    const key=r.reason||(r.focused?'focused':'unknown');
    if(counts[key]===undefined)counts.unknown++;else counts[key]++;
  });
  return{rate:Math.round(counts.focused/total*100),total,counts};
}
// 지난 기간과 비교해서 보여주기 위해, 같은 방식으로 이전 기간의
// 집중도만 가볍게 다시 계산합니다 (출석 id만 select).
async function fetchFocusRateForRange(start,end){
  const rows=await sb(`attendance?student_id=eq.${STATE.id}&checkin_at=lt.${end}&or=(checkout_at.is.null,checkout_at.gte.${start})&select=id`);
  const ids=(Array.isArray(rows)?rows:[]).map(r=>r.id);
  return fetchFocusRate(ids,start,end);
}
// 학부모가 숫자만 보고 바로 "좋아졌는지 나빠졌는지" 느낄 수 있게,
// 퍼센트 대신 지난 기간과 비교한 한 줄 문장으로 보여줍니다.
function renderFocusCompare(cur,prev,prevLabel){
  if(!cur)return '';
  if(!prev)return `<div class="focus-compare none">집중도 ${cur.rate}% — ${prevLabel} 기록이 없어서 아직 비교할 수 없어요</div>`;
  const diff=cur.rate-prev.rate;
  if(Math.abs(diff)<3)return `<div class="focus-compare flat">${prevLabel}와 집중도가 비슷해요 (${cur.rate}%)</div>`;
  const up=diff>0;
  return `<div class="focus-compare ${up?'up':'down'}"><span class="fc-arrow">${up?'▲':'▼'}</span> ${prevLabel}보다 집중도가 <b>${Math.abs(diff)}%p</b> ${up?'올랐어요':'내려갔어요'} <span class="fc-now">(${cur.rate}%)</span></div>`;
}
const FOCUS_REASON_LABEL={
  focused:'집중함',
  no_face:'화면에 안 보임 (자리 이탈 추정)',
  head_turned:'고개를 많이 돌리거나 젖힘',
  eyes_closed:'눈을 감음 (졸음 추정)',
  dozing:'고개를 푹 숙임 (졸음 추정)',
  unknown:'사유 기록 안 됨',
};
let LAST_FOCUS_INFO=null;
function showFocusDetail(){
  if(!LAST_FOCUS_INFO)return;
  const{total,counts}=LAST_FOCUS_INFO;
  const rows=Object.keys(FOCUS_REASON_LABEL)
    .map(k=>({key:k,cnt:counts[k]||0}))
    .filter(r=>r.cnt>0)
    .sort((a,b)=>b.cnt-a.cnt);
  const existing=document.getElementById('focus-detail-modal');
  if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='focus-detail-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.onclick=(e)=>{if(e.target===modal)modal.remove();};
  modal.innerHTML=`<div style="background:var(--surf);border-radius:16px;padding:22px;max-width:340px;width:100%">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px">집중도 판정 내역</div>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:16px">8초마다 찍은 ${total}번의 샘플을 기준으로 계산했어요.</div>
    ${rows.map(r=>{
      const pct=Math.round(r.cnt/total*100);
      return`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px">
          <span>${FOCUS_REASON_LABEL[r.key]}</span><span>${pct}%</span>
        </div>
        <div style="background:var(--bg);border-radius:6px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${r.key==='focused'?'var(--g)':'var(--gold2)'}"></div>
        </div>
      </div>`;
    }).join('')}
    <button onclick="document.getElementById('focus-detail-modal').remove()" style="margin-top:8px;width:100%;padding:11px;background:var(--g);color:#fff;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer">확인</button>
  </div>`;
  document.body.appendChild(modal);
}

/* ── 상태 ── */
const P=new URLSearchParams(location.search);
const isAdmin=P.get('admin')==='1';
const STATE={
  id:P.get('id')||'',
  type:P.get('type')||'daily',
  date:P.get('date')?parseDk(P.get('date')):new Date(),
};
let STUDENT=null,ROOM=null;

function syncUrl(){
  // 탭(일간/주간/월간)이나 날짜를 옮겨 다녀도 주소창에는 반영하지
  // 않습니다 — 여기 반영해두면 새로고침했을 때 그 주소를 그대로 다시
  // 불러오면서 "새로고침하면 오늘 일간으로 돌아온다"는 기대와 달리
  // 마지막으로 보고 있던 탭/날짜에 계속 머물게 돼서, 항상 id(+admin)만
  // 남겨둡니다. 새로고침하면 항상 오늘 날짜의 일간으로 시작해요.
  const params=new URLSearchParams({id:STATE.id});
  if(isAdmin)params.set('admin','1');
  history.replaceState(null,'',location.pathname+'?'+params);
}

async function boot(){
  if(!STATE.id){document.getElementById('loading').textContent='잘못된 링크예요 (학생 정보 없음)';return;}
  const rows=await sb(`planner_students?id=eq.${STATE.id}&select=*`);
  if(!rows||!rows[0]){document.getElementById('loading').textContent='학생 정보를 찾을 수 없어요';return;}
  STUDENT=rows[0];
  if(STUDENT.room_id){
    const r=await sb(`study_rooms?id=eq.${STUDENT.room_id}&select=*`);
    if(r&&r[0])ROOM=r[0];
  }
  document.getElementById('tb-academy').textContent=(ROOM&&ROOM.academy_name)||'학원';
  document.getElementById('stu-avatar').textContent=(STUDENT.name||'?')[0];
  document.getElementById('stu-name').textContent=STUDENT.name+' 학생';
  if(STUDENT.name)document.title=`${STUDENT.name}학생 실시간리포트`;
  document.getElementById('stu-sub').textContent=`${STUDENT.school_name||'학교 미정'} · ${STUDENT.grade||'?'}학년`;
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  // 관리자가 admin.html [학생관리]의 "📊 리포트" 버튼으로 열었을 때만
  // 카카오톡/문자발송/링크복사/인쇄 버튼을 보여줍니다. 그 버튼으로 만든
  // 공유 링크(buildShareUrl)에는 이 표시가 없어서, 학부모가 받은
  // 링크를 열면 버튼 없이 리포트만 깔끔하게 보여요 — 인쇄 버튼도
  // 학부모에게는 딱히 쓸 일이 없어서(지저분하기만 함) 뺐습니다.
  if(isAdmin)document.getElementById('sharebar').style.display='flex';
  switchType(STATE.type,true);
  loadLiveStatus();
  setInterval(loadLiveStatus,30000);
}
// 학부모가 이 링크를 열 때마다(또는 켜둔 채로 기다리는 동안) 그 순간의
// 진짜 상태를 보여줍니다 — 일간/주간/월간 통계는 지나간 기록이라,
// "지금 이 순간" 궁금한 걸 리포트 탭과 별개로 맨 위에 항상 띄워둡니다.
const LIVE_STATUS_LABEL={studying:'지금 공부중이에요',in_class:'지금 학원 수업 중이에요',away:'지금 잠시 외출중이에요'};
async function loadLiveStatus(){
  const rows=await sb(`attendance?student_id=eq.${STATE.id}&checkout_at=is.null&select=status&order=checkin_at.desc&limit=1`);
  const att=Array.isArray(rows)&&rows[0];
  const el=document.getElementById('live-status');
  const status=att&&LIVE_STATUS_LABEL[att.status]?att.status:null;
  el.className='live-status '+(status||'out');
  document.getElementById('live-status-text').textContent=status?LIVE_STATUS_LABEL[status]:'지금 독서실에 있지 않아요';
  el.style.display='flex';
}

function switchType(type,initial){
  STATE.type=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.type===type));
  syncUrl();
  render();
}
function navDate(dir){
  if(STATE.type==='daily')STATE.date=addDays(STATE.date,dir);
  else if(STATE.type==='weekly')STATE.date=addDays(STATE.date,dir*7);
  else{const d=new Date(STATE.date);d.setMonth(d.getMonth()+dir);STATE.date=d;}
  syncUrl();
  render();
}

function render(){
  if(STATE.type==='daily')renderDaily();
  else if(STATE.type==='weekly')renderWeekly();
  else renderMonthly();
}

async function renderDaily(){

      <div class="stat-cell"><div class="stat-num">${clRate}%</div><div class="stat-lbl">체크리스트 달성</div></div>
      <div class="stat-cell"><div class="stat-num">${fmtMin(seg.studying)}</div><div class="stat-lbl">독서실 순공시간</div></div>
      ${focusInfo?`<div class="stat-cell" style="cursor:pointer" onclick="showFocusDetail()"><div class="stat-num">${focusInfo.rate}%</div><div class="stat-lbl">집중도 <span style="opacity:.55">ⓘ</span></div></div>`:''}
    </div>
    ${focusInfo?`<div onclick="showFocusDetail()">${renderFocusCompare(focusInfo,prevFocusInfo,'어제')}</div>`:''}
  </div>

  <div class="card">
    <div class="card-ttl">✅ 체크리스트 (${doneCnt}/${checks.length})</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${clRate}%"></div></div>
  </div>

  <div class="card">
    <div class="card-ttl">🕐 오늘 타임라인</div>
    ${items.length?renderTlList(items):'<div class="empty-note">등록된 일정이 없어요</div>'}

  <div class="card">
    <div class="card-ttl">🚪 입실 · 퇴실 기록</div>

    ${flagNote?`<div class="flag-note">⚠️ ${flagNote}</div>`:''}
  </div>`;
  body.innerHTML=html;
}

function renderTlList(items){
  return `<div>` + [...items].sort((a,b)=>(a.st||'').localeCompare(b.st||'')).map(it=>{
    const cat=CATS.find(c=>c.k===it.cat)||CATS[CATS.length-1];
    return `<div class="tl-item"><div class="tl-dot" style="background:${cat.c}"></div><div class="tl-time">${it.st||''}${it.et?'~'+it.et:''}</div><div class="tl-ttl ${it.done?'done':''}">${it.ttl||cat.l}</div><div class="tl-badge" style="background:${cat.c}22;color:${cat.c}">${cat.l}</div></div>`;
  }).join('') + `</div>`;
}
function renderAttList(att){
  if(!att.length)return '<div class="att-empty">출석 기록이 없어요</div>';
  return att.map(a=>{
    const inT=new Date(a.checkin_at);
    const outT=a.checkout_at?new Date(a.checkout_at):null;
    const dur=fmtMin(((outT||new Date())-inT)/60000);
    const seatNum=a.seat_number??a.seats?.seat_number;
    const seat=seatNum?`${seatNum}번 자리`:'';
    return `<div class="att-row"><div><div class="att-time">${String(inT.getHours()).padStart(2,'0')}:${String(inT.getMinutes()).padStart(2,'0')} → ${outT?String(outT.getHours()).padStart(2,'0')+':'+String(outT.getMinutes()).padStart(2,'0'):'공부중'}</div><div style="font-size:11px;color:var(--ink3);margin-top:2px">${seat}</div></div><div class="att-dur">${dur}</div></div>`;
  }).join('');
}

      <div class="stat-cell"><div class="stat-num">${itemCnt?Math.round(doneCnt/itemCnt*100):0}%</div><div class="stat-lbl">일정 완료율</div></div>
      ${focusInfo?`<div class="stat-cell" style="cursor:pointer" onclick="showFocusDetail()"><div class="stat-num">${focusInfo.rate}%</div><div class="stat-lbl">집중도 <span style="opacity:.55">ⓘ</span></div></div>`:''}
    </div>
    ${focusInfo?`<div onclick="showFocusDetail()">${renderFocusCompare(focusInfo,prevFocusInfo,'지난주')}</div>`:''}
  </div>

  ${(seg.away>=1||seg.in_class>=1||flagNote)?`<div class="card">
    <div class="card-ttl">🚶 외출 · 학원수업 현황</div>
    <div class="stat-grid c2">
      <div class="stat-cell"><div class="stat-num">${fmtMin(seg.away)}</div><div class="stat-lbl">외출 시간</div></div>
      <div class="stat-cell"><div class="stat-num">${fmtMin(seg.in_class)}</div><div class="stat-lbl">학원수업 시간</div></div>

/* ══════════ 월간 ══════════ */
async function renderMonthly(){
  const d=STATE.date,y=d.getFullYear(),m=d.getMonth();
  document.getElementById('dn-label').textContent=`${y}년 ${m+1}월`;
  const body=document.getElementById('report-body');
  body.innerHTML='<div class="empty-note">불러오는 중...</div>';

  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const start=`${dk(first)}T00:00:00`,end=`${dk(addDays(last,1))}T00:00:00`;
  const att=await fetchAttWithSegments(`attendance?student_id=eq.${STATE.id}&checkin_at=lt.${end}&or=(checkout_at.is.null,checkout_at.gte.${start})&select=id,checkin_at,checkout_at,status&order=checkin_at.asc`,new Date(start),new Date(end));
  const attDays=new Set(att.map(a=>dk(new Date(a.checkin_at))));
  const seg=sumSeg(att);
  const totalMin=seg.studying;
  const flagNote=awayFlagNote(seg);

  const isCurMonth=(y===new Date().getFullYear()&&m===new Date().getMonth());
  const daysConsidered=isCurMonth?new Date().getDate():last.getDate();
  const attRate=daysConsidered?Math.round(attDays.size/daysConsidered*100):0;

  // 주차별 성장 그래프 (실제 순공시간 기준)
  const weeks=[];
  let cur=mondayOf(first);
  while(cur<=last){
    const wEnd=addDays(cur,6);
    let wMin=0;
    att.forEach(a=>{const t=new Date(a.checkin_at);if(t>=cur&&t<=addDays(wEnd,1))wMin+=a._seg.studying;});
    weeks.push({label:`${cur.getMonth()+1}/${cur.getDate()}`,min:wMin});
    cur=addDays(cur,7);
  }
  const maxW=Math.max(1,...weeks.map(w=>w.min));

  const focusInfo=await fetchFocusRate(att.map(a=>a.id),start,end);
  if(focusInfo)LAST_FOCUS_INFO=focusInfo;
  const prevFirst=new Date(y,m-1,1);
  const prevFocusInfo=focusInfo?await fetchFocusRateForRange(`${dk(prevFirst)}T00:00:00`,start):null;
  const stats={attendanceDays:attDays.size,attendanceRate:attRate,totalStudyMinutes:Math.round(totalMin),awayMinutes:Math.round(seg.away),weeklyTrend:weeks.map(w=>Math.round(w.min))};

  let html=`<div class="card">
    <div class="card-ttl">📊 이번 달 요약</div>
    <div class="stat-grid${focusInfo?' c4':''}">
      <div class="stat-cell"><div class="stat-num">${attRate}%</div><div class="stat-lbl">출석률</div></div>
      <div class="stat-cell"><div class="stat-num">${attDays.size}일</div><div class="stat-lbl">출석일수</div></div>
      <div class="stat-cell"><div class="stat-num">${fmtMin(totalMin)}</div><div class="stat-lbl">누적 순공시간</div></div>
      ${focusInfo?`<div class="stat-cell" style="cursor:pointer" onclick="showFocusDetail()"><div class="stat-num">${focusInfo.rate}%</div><div class="stat-lbl">집중도 <span style="opacity:.55">ⓘ</span></div></div>`:''}
    </div>
    ${focusInfo?`<div onclick="showFocusDetail()">${renderFocusCompare(focusInfo,prevFocusInfo,'지난달')}</div>`:''}
  </div>

  <div class="card">
    <div class="card-ttl">📈 주차별 성장 그래프</div>
    <div class="growth">
      ${weeks.map(w=>`<div class="gr-col"><div class="gr-val">${w.min>=60?Math.round(w.min/60*10)/10+'h':Math.round(w.min)+'m'}</div><div class="gr-bar" style="height:${Math.max(3,w.min/maxW*100)}%"></div><div class="gr-lbl">${w.label}</div></div>`).join('')}
    </div>
  </div>

  ${(seg.away>=1||seg.in_class>=1||flagNote)?`<div class="card">
    <div class="card-ttl">🚶 외출 · 학원수업 현황</div>
    <div class="stat-grid c2">
      <div class="stat-cell"><div class="stat-num">${fmtMin(seg.away)}</div><div class="stat-lbl">외출 시간</div></div>
      <div class="stat-cell"><div class="stat-num">${fmtMin(seg.in_class)}</div><div class="stat-lbl">학원수업 시간</div></div>
    </div>
    ${flagNote?`<div class="flag-note">⚠️ ${flagNote}</div>`:''}
  </div>`:''}

  <div id="ai-card"></div>`;
  body.innerHTML=html;
  renderAiComment('monthly',stats);
}

/* ── 선생님 한마디 ── */
async function renderAiComment(type,stats){
  const el=document.getElementById('ai-card');
  if(!el)return;
  el.innerHTML=`<div class="ai-card"><div class="ai-ttl">✨ ${type==='monthly'?'월간 총평':'선생님 한마디'}</div><div class="ai-loading">작성 중...</div></div>`;
  let comment=null;
  try{
    const r=await fetch('/api/generate-report-comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,name:STUDENT.name,stats})});
    const data=await r.json();
    if(data.success&&data.comment)comment=data.comment;
  }catch(e){}
  if(!comment)comment=fallbackComment(type,stats);
  el.innerHTML=`<div class="ai-card"><div class="ai-ttl">✨ ${type==='monthly'?'월간 총평':'선생님 한마디'}</div><div class="ai-text">${comment}</div></div>`;
}
function fallbackComment(type,stats){
  const name=STUDENT.name;
  const awayNote=(stats.awayMinutes>=30&&stats.totalStudyMinutes&&stats.awayMinutes/(stats.totalStudyMinutes+stats.awayMinutes)>=0.2)?` 다만 외출 시간(${fmtMin(stats.awayMinutes)})이 다소 있었어요.`:'';
  if(type==='monthly'){
    if(!stats.attendanceDays)return `${name} 학생은 이번 달 독서실 출석 기록이 없어요. 다음 달엔 꾸준한 출석부터 함께 시작해봐요.`;
    return `${name} 학생은 이번 달 ${stats.attendanceDays}일 출석해 출석률 ${stats.attendanceRate}%, 누적 순공시간 ${fmtMin(stats.totalStudyMinutes)}를 기록했어요.${awayNote} 꾸준함을 유지하면서 다음 달엔 조금 더 긴 공부 세션에 도전해보면 좋겠어요.`;
  }
  if(!stats.attendanceDays)return `${name} 학생은 이번 주 독서실 출석 기록이 없어요. 다음 주엔 가벼운 목표부터 다시 시작해봐요.`;
  const top=stats.topSubjects?.[0];
  return `${name} 학생은 이번 주 ${stats.attendanceDays}일 출석해 순공시간 ${fmtMin(stats.totalStudyMinutes)}를 기록했어요.${top?` 특히 ${top.subject} 공부에 집중했네요.`:''}${awayNote} 일정 완료율 ${stats.timelineItems?Math.round(stats.timelineDone/stats.timelineItems*100):0}%를 유지하며 다음 주도 꾸준히 이어가봐요.`;
}

/* ── 공유 ── */
const TYPE_LABEL={daily:'일간',weekly:'주간',monthly:'월간'};
function buildShareUrl(){
  // date와 type을 안 넣어야, 학부모가 이 링크를 언제 열든 항상 "일간"
  // 탭의 오늘(가장 자주 확인하고 싶어할 화면)부터 보여줘요. 관리자가
  // 공유 버튼을 누른 순간의 탭/날짜를 그대로 넣으면, 예를 들어 관리자가
  // 주간 탭을 보다가 공유했을 때 그 링크가 계속 주간·특정 날짜에
  // 고정돼버려요. 열어본 뒤에는 학부모가 직접 일간/주간/월간을
  // 자유롭게 눌러서 다 볼 수 있으니 문제없어요.
  const params=new URLSearchParams({id:STATE.id});
  return location.origin+location.pathname+'?'+params.toString();
}
function copyLink(type){
  navigator.clipboard.writeText(buildShareUrl()).then(()=>toast('링크가 복사됐어요'));
}
async function shareKakao(type){
  const url=buildShareUrl();
  if(!ROOM?.kakao_js_key){
    if(navigator.share){navigator.share({title:'학습 리포트',text:`${STUDENT.name} 학생의 학습 리포트`,url}).catch(()=>{});}
    else{navigator.clipboard.writeText(url).then(()=>toast('링크가 복사됐어요 (카카오 공유를 쓰려면 admin.html [설정]에서 카카오 JS 키를 등록하세요)'));}
    return;
  }
  try{
    if(!window.Kakao){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    if(!window.Kakao.isInitialized())window.Kakao.init(ROOM.kakao_js_key);
    window.Kakao.Share.sendDefault({
      objectType:'feed',
      content:{title:`${STUDENT.name} 학생 ${TYPE_LABEL[type||STATE.type]} 리포트`,description:`플래니에서 확인해보세요`,imageUrl:location.origin+'/icon.svg',link:{mobileWebUrl:url,webUrl:url}},
      buttons:[{title:'리포트 보기',link:{mobileWebUrl:url,webUrl:url}}]
    });
  }catch(e){navigator.clipboard.writeText(url).then(()=>toast('링크가 복사됐어요'));}
}
async function shareSms(type){
  if(!STUDENT.parent_phone){toast('학부모 연락처가 등록되지 않았어요');return;}
  if(!ROOM?.aligo_api_key){toast('admin.html [설정]에서 문자 발송 키를 먼저 등록하세요');return;}
  const url=buildShareUrl();
  const msg=`[${ROOM.academy_name||'학원'}] ${STUDENT.name} 학생의 ${TYPE_LABEL[type||STATE.type]} 학습 리포트입니다.\n${url}`;
  try{
    const r=await fetch('/api/send-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:STUDENT.parent_phone,message:msg,channel:'sms',aligo:{key:ROOM.aligo_api_key,user:ROOM.aligo_user_id,sender:ROOM.aligo_sender}})});
    const data=await r.json();
    toast(data.success?'문자를 발송했어요':'발송에 실패했어요');
  }catch(e){toast('발송 중 오류가 발생했어요');}
}

boot();
