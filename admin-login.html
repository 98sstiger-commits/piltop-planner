<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 · 플래니</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--green);color:#18170F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
:root{--green:#0E2C22;--gold:#C6A664;--gold2:#A9884E;--gs:#E5EFE9;--line:#E6E3DC;--line2:#CCC9C1;--surf:#fff;--ink2:#69675E;--ink3:#A8A49C}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{width:48px;height:48px;border-radius:14px;background:var(--green);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;margin:0 auto 16px}
.ttl{font-size:16px;font-weight:800;text-align:center;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px;margin-bottom:22px}
.field-label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:block}
input{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#18170F}
input:focus{outline:none;border-color:var(--green)}
.btn{width:100%;padding:13px;border-radius:9px;background:var(--gold);color:#2A2109;font-size:14px;font-weight:700;border:none;margin-top:14px;cursor:pointer;transition:background .12s}
.btn:hover{background:var(--gold2)}
.err{font-size:12px;color:#B91C1C;margin-top:10px;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">플</div>
  <div class="ttl">관리자 로그인</div>
  <div class="sub">플래니 · 자기주도학습 종합관리</div>
  <label class="field-label">비밀번호</label>
  <input type="password" id="pw" placeholder="비밀번호를 입력하세요" autofocus>
  <button class="btn" id="btn" onclick="submitLogin()">로그인</button>
  <div class="err" id="err"></div>
</div>
<script>
const pw = document.getElementById('pw');
pw.addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });

async function submitLogin() {
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  const password = pw.value;
  if (!password) { err.textContent = '비밀번호를 입력해주세요'; return; }
  btn.disabled = true; btn.textContent = '확인 중...';
  try {
    const r = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await r.json();
    if (data.success) {
      const next = new URLSearchParams(location.search).get('next') || '/admin.html';
      location.href = next;
    } else {
      err.textContent = '비밀번호가 틀렸어요';
      pw.value = ''; pw.focus();
      btn.disabled = false; btn.textContent = '로그인';
    }
  } catch (e) {
    err.textContent = '로그인 중 오류가 발생했어요';
    btn.disabled = false; btn.textContent = '로그인';
  }
}
</script>
</body>
</html>
